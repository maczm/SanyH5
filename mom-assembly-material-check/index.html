<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>装配物料检查</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="app-container mom-assembly-material-check">
      <!-- ==================== 页面头部 ==================== -->
      <div class="page-header">
        <span class="header-title">装配物料检查</span>
        <span class="header-time"></span>
      </div>

      <!-- ==================== 视图1：工位选择 ==================== -->
      <div class="station-select-view">
        <div class="station-filter-area">
          <div class="input-row">
            <input
              class="search-input input-station-filter"
              type="text"
              placeholder="输入工位编码或名称筛选"
              autocomplete="off"
            />
            <button type="button" class="icon-btn btn-search btn-search-station" aria-label="搜索工位">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            </button>
            <button type="button" class="icon-btn btn-scan btn-scan-station" aria-label="扫码工位">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 12h10"/></svg>
            </button>
          </div>
        </div>
        <div class="station-list">
          <div class="empty-state hidden empty-station-list">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <p>暂无工位数据</p>
          </div>
        </div>
      </div>

      <!-- ==================== 视图2：物料检查 ==================== -->
      <div class="material-check-view hidden">
        <div class="check-form-area">
          <div class="check-form-row">
            <span class="check-form-label">检查工位</span>
            <span class="info-tag work-station-tag"></span>
          </div>
          <div class="check-form-row">
            <span class="check-form-label">订单号/VIN码</span>
            <div class="input-row">
              <input
                class="search-input input-order-key"
                type="text"
                placeholder="请输入或扫码订单号/VIN"
                autocomplete="off"
              />
              <button type="button" class="icon-btn btn-search btn-search-order" aria-label="搜索订单">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
              </button>
              <button type="button" class="icon-btn btn-scan btn-scan-order" aria-label="扫码订单">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 12h10"/></svg>
              </button>
            </div>
          </div>
          <div class="check-form-row">
            <span class="check-form-label">物料二维码</span>
            <div class="input-row">
              <input
                class="search-input input-material-qr"
                type="text"
                placeholder="扫码或输入：物料编码|供应商|序列号:数量"
                autocomplete="off"
              />
              <button type="button" class="icon-btn btn-search btn-search-material" aria-label="搜索物料">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
              </button>
              <button type="button" class="icon-btn btn-scan btn-scan-material" aria-label="扫码物料">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 12h10"/></svg>
              </button>
            </div>
          </div>
          <div class="info-grid">
            <div class="check-form-row">
              <span class="check-form-label">计划上线时间</span>
              <span class="info-tag plan-start-time-tag"></span>
            </div>
            <div class="check-form-row">
              <span class="check-form-label">月顺序号</span>
              <span class="info-tag month-sequence-tag"></span>
            </div>
            <div class="check-form-row">
              <span class="check-form-label">主机编码</span>
              <span class="info-tag host-code-tag"></span>
            </div>
            <div class="check-form-row">
              <span class="check-form-label">主机简称</span>
              <span class="info-tag host-alias-tag"></span>
            </div>
          </div>
        </div>

        <div class="check-result-area">
          <div class="empty-state empty-check-result">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <p>暂无检查结果</p>
          </div>
        </div>

        <div class="bottom-action-area">
          <button type="button" class="btn-check-complete">检查完成</button>
          <button type="button" class="btn-back-station">返回</button>
        </div>
      </div>

      <!-- ==================== 循环结构模板 ==================== -->
      <template class="template-station-item">
        <div class="station-item">
          <span class="station-code"></span>
          <span class="station-desc"></span>
        </div>
      </template>
      <template class="template-check-result-row">
        <div class="check-result-row">
          <span class="cr-result-icon">
            <svg class="cr-icon-pass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
            <svg class="cr-icon-fail hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </span>
          <span class="cr-material-code"></span>
          <span class="cr-join">-</span>
          <span class="cr-material-desc"></span>
          <span class="cr-join">-</span>
          <span class="cr-check-time"></span>
        </div>
      </template>

      <!-- ==================== 弹窗骨架（hidden 预埋，JS 只显隐/填值） ==================== -->
      <!-- 加载中 -->
      <div class="loading-mask hidden template-loading">
        <div class="loading-box">
          <div class="loading-spinner"></div>
          <div class="loading-text">加载中...</div>
        </div>
      </div>
      <!-- Toast（非阻断，3s 自动消失） -->
      <div class="toast-mask hidden template-toast">
        <div class="toast-box">
          <div class="toast-icon-area">
            <div class="toast-icon-error hidden">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <div class="toast-icon-success hidden">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
            </div>
          </div>
          <div class="toast-title"></div>
          <div class="toast-content hidden"></div>
          <button type="button" class="toast-btn">确定</button>
        </div>
      </div>
    </div>

    <script src="../jquery.min.js"></script>
    <script src="mock.js"></script>
    <script src="index.js"></script>
  </body>
</html>
