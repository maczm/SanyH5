<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>照片上传</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="mom-photo-upload" class="app-container">
      <!-- 页面头部（静态） -->
      <div class="page-header">
        <span class="header-title">照片上传</span>
        <span class="header-operator" id="header-operator"></span>
        <span class="header-time" id="header-time"></span>
      </div>

      <!-- 表单区（静态骨架；折叠摘要由 JS 填充） -->
      <div class="form-area" id="form-area">
        <div class="form-card" id="form-card">
          <div class="form-group">
            <label class="form-label">工位选择</label>
            <div class="combobox-wrapper" id="combobox-station">
              <input
                class="combobox-input"
                id="input-station"
                type="text"
                placeholder="输入工位编码或名称筛选"
                autocomplete="off"
              />
              <input type="hidden" id="input-station-code" />
              <svg class="combobox-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6" /></svg>
              <div class="combobox-dropdown" id="dropdown-station" style="display:none;"></div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">订单号</label>
            <div class="input-row">
              <input
                class="search-input"
                id="input-order"
                type="text"
                placeholder="请输入或扫码订单号"
              />
              <button type="button" class="icon-btn btn-scan" id="btn-scan-order">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2" /></svg>
              </button>
            </div>
          </div>
          <button type="button" class="btn-query" id="btn-query">查询照片配置</button>
          <div class="form-btn-row" id="form-btn-row" style="display:none;">
            <button type="button" class="btn-collapse-form" id="btn-collapse-form">收起 ▲</button>
            <button type="button" class="btn-clear-form" id="btn-clear-form">清空</button>
          </div>
        </div>
        <!-- 折叠态摘要（JS 填充） -->
        <div class="form-summary" id="form-summary" style="display:none;"></div>
      </div>

      <!-- 订单信息区（动态渲染容器） -->
      <div class="order-info-area hidden" id="order-info-area"></div>

      <!-- 照片类型卡片区（动态渲染容器） -->
      <div class="photo-cards-area" id="photo-cards-area"></div>

      <!-- 底部按钮区（静态） -->
      <div class="confirm-section hidden" id="confirm-section">
        <button type="button" class="btn-confirm" id="btn-confirm">提交AI检测</button>
        <button type="button" class="btn-save" id="btn-save">保存工位照片信息</button>
      </div>

      <!-- 隐藏的文件选择 input（静态） -->
      <input
        type="file"
        id="photo-input"
        accept="image/*"
        style="position:absolute;opacity:0;width:0;height:0;overflow:hidden;"
      />
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.4.0/dist/jquery.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
