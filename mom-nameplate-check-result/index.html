<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>铭牌检查结果</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="app-container mom-check-result">
      <!-- ==================== 页面头部 ==================== -->
      <div class="page-header">
        <span class="header-title">铭牌检查结果</span>
        <span class="header-time"></span>
      </div>

      <!-- ==================== 结果内容区（banner/卡片由模板克隆渲染） ==================== -->
      <div class="result-body"></div>

      <!-- ==================== 循环结构模板 ==================== -->
      <!-- 任务状态横幅（待处理/处理中/失败） -->
      <template class="template-task-banner">
        <div class="status-banner processing">
          <div class="sb-icon"><span class="sb-spinner"></span></div>
          <div class="sb-title"></div>
          <div class="sb-sub"></div>
          <div class="sb-meta">
            <span class="task-accept-no">受理单号：-</span>
            <span class="task-status hidden">状态：-</span>
          </div>
        </div>
      </template>
      <!-- 整体结论横幅（通过/不通过/不确定/需重试 + 统计） -->
      <template class="template-status-banner">
        <div class="status-banner">
          <div class="sb-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"></svg>
          </div>
          <div class="sb-title"></div>
          <div class="sb-sub"></div>
          <div class="sb-meta">
            <span class="accept-no">受理单号：-</span>
            <span class="completed-at">完成时间：-</span>
            <span class="banner-status hidden">状态：-</span>
          </div>
          <div class="sb-summary hidden"></div>
        </div>
      </template>
      <!-- 检查项卡片 -->
      <template class="template-check-card">
        <div class="check-card">
          <div class="check-card-header">
            <div class="check-title-wrap">
              <span class="check-name"></span>
              <span class="check-code hidden"></span>
            </div>
            <span class="ck-badge"></span>
          </div>
          <div class="check-reason hidden">
            <span class="reason-label">原因</span>
            <span class="reason-text"></span>
          </div>
          <div class="field-list"></div>
        </div>
      </template>
      <!-- 字段明细行 -->
      <template class="template-field-row">
        <div class="field-row">
          <div class="field-label-wrap">
            <span class="field-name-cn"></span>
            <span class="field-name-en hidden"></span>
          </div>
          <div class="field-values">
            <div class="fv">
              <span class="fv-label">识别值</span>
              <div class="fv-value-line">
                <span class="fv-val"></span>
                <span class="fv-unit hidden"></span>
              </div>
            </div>
            <div class="fv">
              <span class="fv-label">正确值</span>
              <div class="fv-value-line">
                <span class="fv-val"></span>
                <span class="fv-unit hidden"></span>
              </div>
            </div>
          </div>
          <span class="f-badge"></span>
        </div>
      </template>
      <!-- 空态提示 -->
      <template class="template-empty-state">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
          <p></p>
        </div>
      </template>
      <!-- 统计 chip（通过/未通过/跳过） -->
      <template class="template-sum-chip">
        <span class="sum-chip"><b></b></span>
      </template>

      <!-- 返回按钮（固定右上角，行为由 index.js 绑定） -->
      <button type="button" class="back-button" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>返回</span>
      </button>
    </div>

    <script src="../jquery.min.js"></script>
    <script src="mock.js"></script>
    <script src="index.js"></script>
  </body>
</html>
