<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>合格证AI图像采集</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="panel app-container mom-cert-ai-collect">
      <div class="toast-container" aria-live="polite"></div>

      <!-- ==================== 公共头部 ==================== -->
      <div class="header page-header">
        <div class="row header-row-primary">
          <div class="order-box">
            <span class="order-box-label">订单号</span>
            <span class="order-no-value">-</span>
          </div>
          <div class="search-group">
            <input
              class="search-input input-search"
              type="text"
              placeholder="输入单号/VIN/月顺序号"
              autocomplete="off"
              enterkeyhint="search"
            />
            <button type="button" class="btn-blue btn-search-order">搜索</button>
            <button type="button" class="btn-scan-header btn-scan-order" aria-label="扫码订单">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 12h10" />
              </svg>
            </button>
          </div>
        </div>
        <div class="row header-row-secondary">
          <div class="order-box host-code-box">
            <span class="order-box-label">主机编码</span>
            <span class="host-code-value">-</span>
          </div>
          <div class="vin-info">
            <div class="info-item"><span class="info-label">Vin</span><span class="info-value vin-value">-</span></div>
            <div class="info-item"><span class="info-label">月顺序号</span><span class="info-value month-sequence-value">-</span></div>
          </div>
        </div>
      </div>

      <div class="action-bar page-action-bar">
        <button type="button" class="btn-minus btn-collapse-header" aria-label="收起订单信息">-</button>
        <button type="button" class="refresh-chip hidden" aria-label="立即刷新状态">
          <span class="refresh-icon" aria-hidden="true">⟳</span>
          <span class="refresh-text">30s</span>
        </button>
        <button type="button" class="toggle-control header-toggle">
          <svg class="icon-svg header-toggle-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M18 15L12 9L6 15" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="page-indicator">0/0</span>
        </button>
      </div>

      <!-- ==================== 视图1：采集详情 ==================== -->
      <div class="view view-detail active">
        <div class="content">
          <div class="main-category-header">
            <span class="category-title">采集项：-</span>
            <div class="category-status-group">
              <span class="category-status-tag tag-blue">待查询</span>
              <span class="category-result-tag tag-gray">结果：-</span>
            </div>
          </div>
          <div class="subcategory-list"></div>
          <div class="empty-state hidden empty-task">
            <p>请输入单号/VIN/月顺序号查询采集任务</p>
          </div>
        </div>
        <div class="footer">
          <button type="button" class="footer-btn btn-outline-main btn-open-list disabled" aria-disabled="true">采集列表</button>
          <button type="button" class="footer-btn btn-submit btn-save disabled" aria-disabled="true">保存并继续</button>
        </div>
      </div>

      <!-- ==================== 视图2：采集列表 ==================== -->
      <div class="view view-list">
        <div class="list-status-bar">
          <span>整体检验结论：</span>
          <span class="list-conclusion">待查询</span>
        </div>
        <div class="table-container">
          <table class="list-table">
            <thead>
              <tr>
                <th width="15%">序号</th>
                <th width="40%">采集项名称</th>
                <th width="20%">状态</th>
                <th width="25%">结果</th>
              </tr>
            </thead>
            <tbody class="list-table-body"></tbody>
          </table>
          <div class="empty-state hidden empty-task-table">
            <p>暂无采集任务</p>
          </div>
        </div>
        <div class="list-footer">
          <button type="button" class="btn-refresh btn-back-detail disabled" aria-disabled="true">返回详情</button>
        </div>
      </div>

      <input type="file" class="photo-input-hidden" accept="image/*" capture="environment" />

      <!-- ==================== 更新数据确认 ==================== -->
      <div class="modal-overlay confirm-mask hidden">
        <div class="modal">
          <h3>确认更新数据？</h3>
          <p>将停用当前采集记录并重新采集，历史识别记录保留。是否确认？</p>
          <div class="modal-btns">
            <button type="button" class="modal-btn modal-btn-cancel confirm-btn-cancel">取消</button>
            <button type="button" class="modal-btn modal-btn-confirm confirm-btn-ok">确认更新</button>
          </div>
        </div>
      </div>

      <div class="modal-overlay conflict-mask hidden">
        <div class="modal">
          <h3>无法保存</h3>
          <p class="conflict-message"></p>
          <div class="modal-btns">
            <button type="button" class="modal-btn modal-btn-cancel conflict-btn-close">关闭</button>
            <button type="button" class="modal-btn modal-btn-primary conflict-btn-refresh">刷新最新数据</button>
          </div>
        </div>
      </div>

      <!-- ==================== 循环结构模板 ==================== -->
      <template class="template-cert-ai-sub-card">
        <div class="sub-item-card">
          <div class="sub-header">
            <div class="sub-title">
              <span class="sub-name"></span>
              <span class="req-tag"></span>
              <span class="count-tag"></span>
            </div>
            <span class="status-tag tag-blue"></span>
          </div>
          <div class="sub-req-text hidden"></div>
          <div class="img-upload-area">
            <button type="button" class="upload-box">
              <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
              <span class="upload-text">点击拍照</span>
            </button>
            <div class="no-need-collect hidden">该项无需采集图片，跳过即可。</div>
          </div>
          <div class="action-btns hidden">
            <button type="button" class="btn-xs btn-pending" disabled>识别中...</button>
            <button type="button" class="btn-xs btn-warning btn-re-recognize">源数据重新识别</button>
            <button type="button" class="btn-xs btn-danger-outline btn-reset-data">更新数据</button>
          </div>
          <div class="ai-result-row">
            <span class="ai-result-label">AI结论：</span>
            <span class="ai-result-value">待识别</span>
          </div>
        </div>
      </template>

      <template class="template-cert-ai-photo-item">
        <div class="img-preview-box">
          <img src="" alt="" />
          <div class="loading-mask hidden">
            <div class="spinner"></div>
            处理中
          </div>
          <button type="button" class="img-del-bar" aria-label="删除照片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            删除
          </button>
        </div>
      </template>

      <template class="template-cert-ai-list-row">
        <tr class="list-row">
          <td class="list-index"></td>
          <td class="list-main-name"></td>
          <td><span class="list-status"></span></td>
          <td><span class="list-result"></span></td>
        </tr>
      </template>

      <template class="template-cert-ai-toast">
        <div class="toast">
          <span class="toast-icon"></span>
          <span class="toast-message"></span>
        </div>
      </template>
    </div>

    <script src="../jquery.min.js"></script>
    <script src="mock.js"></script>
    <script src="index.js"></script>
  </body>
</html>
